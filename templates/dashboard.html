<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Federal Document Tracker</title>
  <style>
    :root { color-scheme: light; --ink:#17211d; --muted:#627069; --paper:#f5f1e8; --line:#d5d0c4; --accent:#a72a1d; --panel:#fffdf8; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif; }
    header { padding:28px clamp(18px,4vw,56px) 20px; border-bottom:4px solid var(--ink); }
    h1 { margin:0; font:700 clamp(27px,4vw,48px)/1 Georgia,serif; letter-spacing:-.025em; }
    header p { color:var(--muted); margin:10px 0 0; }
    main { padding:20px clamp(18px,4vw,56px) 50px; }
    .filters { display:grid; grid-template-columns:2fr repeat(3,minmax(150px,1fr)); gap:10px; }
    .filters.secondary { grid-template-columns:repeat(5,minmax(120px,1fr)); margin-top:10px; }
    input,select,button { width:100%; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--ink); padding:10px; font:inherit; }
    button { cursor:pointer; background:var(--ink); color:white; font-weight:700; }
    .stats { display:flex; gap:24px; margin:18px 0 12px; color:var(--muted); flex-wrap:wrap; }
    .stats strong { color:var(--ink); }
    .status { margin-left:auto; }
    .table-wrap { overflow:auto; border-top:2px solid var(--ink); background:var(--panel); }
    table { border-collapse:collapse; min-width:1050px; width:100%; }
    th { position:sticky; top:0; background:var(--ink); color:white; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.08em; padding:10px; }
    td { border-bottom:1px solid var(--line); padding:11px 10px; vertical-align:top; }
    td.date,td.amount { white-space:nowrap; font-variant-numeric:tabular-nums; }
    td.amount { font-weight:700; }
    a { color:var(--ink); font-weight:700; text-decoration-thickness:1px; text-underline-offset:2px; }
    .source,.kind { color:var(--muted); font-size:12px; }
    .empty { text-align:center; padding:40px; color:var(--muted); }
    @media (max-width:850px) { .filters,.filters.secondary { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Federal Document Tracker</h1>
    <p>Queryable reporting leads from the linked Neon archive. Results refresh every 30 seconds.</p>
  </header>
  <main>
    <form id="filters">
      <div class="filters">
        <input name="q" type="search" placeholder="Search headlines, companies, departments…">
        <select name="company"><option value="">All companies</option></select>
        <select name="department"><option value="">All departments</option></select>
        <select name="source"><option value="">All sources</option></select>
      </div>
      <div class="filters secondary">
        <input name="min_amount" type="number" min="0" step="any" placeholder="Minimum amount">
        <input name="max_amount" type="number" min="0" step="any" placeholder="Maximum amount">
        <input name="date_from" type="date" aria-label="From date">
        <input name="date_to" type="date" aria-label="To date">
        <select name="sort">
          <option value="newest">Newest first</option>
          <option value="amount_desc">Largest amount first</option>
          <option value="amount_asc">Smallest amount first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </div>
    </form>
    <div class="stats">
      <span><strong id="shown">—</strong> events shown</span>
      <span><strong id="with-amount">—</strong> with amounts</span>
      <span>Largest: <strong id="largest">—</strong></span>
      <span class="status" id="status">Loading…</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Amount</th><th>Company / entity</th><th>Department</th><th>Headline</th><th>Source</th></tr></thead>
        <tbody id="events"><tr><td class="empty" colspan="6">Loading events…</td></tr></tbody>
      </table>
    </div>
  </main>
  <script>
    const form = document.querySelector('#filters');
    const body = document.querySelector('#events');
    const money = new Intl.NumberFormat('en-US', {style:'currency',currency:'USD',maximumFractionDigits:0});
    let facetsLoaded = false;
    function text(tag, value, className='') { const el=document.createElement(tag); el.textContent=value || '—'; el.className=className; return el; }
    function setOptions(name, values, label) {
      const select=form.elements[name], selected=select.value; select.replaceChildren(new Option(label,''));
      values.forEach(value => select.add(new Option(value,value))); select.value=selected;
    }
    async function refresh() {
      const params=new URLSearchParams(new FormData(form));
      for (const [key,value] of [...params]) if (!value) params.delete(key);
      params.set('limit','200');
      document.querySelector('#status').textContent='Refreshing…';
      try {
        const response=await fetch('/api/events?'+params); if (!response.ok) throw new Error('HTTP '+response.status);
        const data=await response.json();
        if (!facetsLoaded) {
          setOptions('company',data.facets.companies,'All companies'); setOptions('department',data.facets.departments,'All departments'); setOptions('source',data.facets.sources,'All sources'); facetsLoaded=true;
        }
        body.replaceChildren();
        if (!data.events.length) { const row=document.createElement('tr'); const cell=text('td','No matching events','empty'); cell.colSpan=6; row.append(cell); body.append(row); }
        data.events.forEach(event => {
          const row=document.createElement('tr');
          row.append(text('td',event.event_date,'date'));
          const amount=text('td',event.amount_value == null ? '—' : money.format(event.amount_value),'amount');
          if (event.amount_type) amount.append(text('div',event.amount_type.replaceAll('_',' '),'kind'));
          if (event.amount_percentile >= .95) amount.append(text('div','Top 5% for this source/type','kind')); row.append(amount);
          row.append(text('td',event.company_name || event.entity_name)); row.append(text('td',event.department_name));
          const headline=document.createElement('td'), link=document.createElement('a'); link.href=event.link; link.target='_blank'; link.rel='noopener'; link.textContent=event.title; headline.append(link); row.append(headline);
          row.append(text('td',event.source_name,'source')); body.append(row);
        });
        document.querySelector('#shown').textContent=data.stats.shown; document.querySelector('#with-amount').textContent=data.stats.with_amount;
        document.querySelector('#largest').textContent=data.stats.largest_amount == null ? '—' : money.format(data.stats.largest_amount);
        document.querySelector('#status').textContent='Updated '+new Date(data.stats.refreshed_at).toLocaleTimeString();
      } catch (error) { document.querySelector('#status').textContent='Refresh failed: '+error.message; }
    }
    form.addEventListener('input', () => { clearTimeout(window.filterTimer); window.filterTimer=setTimeout(refresh,250); });
    refresh(); setInterval(refresh,30000);
  </script>
</body>
</html>
