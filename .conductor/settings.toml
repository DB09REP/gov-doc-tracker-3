"$schema" = "https://json.schemastore.org/conductor-settings.json"

[scripts]
setup = "python3 -m venv .venv && .venv/bin/python -m pip install -r requirements.txt"
run_mode = "concurrent"

[scripts.run.dashboard]
available_in = ["local"]
command = ".venv/bin/python dashboard.py --port $CONDUCTOR_PORT"
default = true
icon = "newspaper"
